name: Update Beyond100
on:
  schedule:
    - cron: "7 * * * *"   # every hour at minute 7 (free API tier: 100 requests/day)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y fonts-dejavu-core fonts-liberation
      - name: Build results + site
        env:
          LIVETENNIS_KEY: ${{ secrets.LIVETENNIS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python result_card.py --live --track-only --max 3 --out out
          python result_card.py --results --max-checks 2 --out out
          python weekly.py out
          python publisher.py prepare out
          python result_card.py --page
      - name: Keep new cards and captions (7 days)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cards
          path: out/
          retention-days: 7
          if-no-files-found: ignore
      - name: Save state (public display data only)
        run: |
          git config user.name "beyond100-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          for f in tracked.json results.json ranks.json posts.json carousels.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if [ -d posts ]; then git add -A -f posts; fi
          if ! git diff --cached --quiet; then git commit -m "Update state"; git push; fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=beyond100
      - name: Send new posts to Instagram (only if PUBLISH_AUTO=1)
        env:
          PUBLISH_AUTO: ${{ vars.PUBLISH_AUTO }}
          PUBLISH_BACKEND: ${{ vars.PUBLISH_BACKEND }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_WEBHOOK_CAROUSEL_URL: ${{ secrets.MAKE_WEBHOOK_CAROUSEL_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publisher.py send
      - name: Save sent flags
        run: |
          git add -f posts.json carousels.json 2>/dev/null || git add -f posts.json || true
          if ! git diff --cached --quiet; then git commit -m "Update posts"; git pull --rebase --autostash || true; git push; fi
