name: Check live feed
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: What is live right now?
        env:
          LIVETENNIS_KEY: ${{ secrets.LIVETENNIS_KEY }}
        run: python diag.py
